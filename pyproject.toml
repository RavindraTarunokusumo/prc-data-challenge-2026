[project]
name = "prc"
version = "0.1.0"
description = "PRC Data Challenge 2026: autonomous taxi-out-time research (team genuine-cabbage)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "optuna>=3.6",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "boto3>=1.34",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prc"]

[tool.ruff]
line-length = 100
