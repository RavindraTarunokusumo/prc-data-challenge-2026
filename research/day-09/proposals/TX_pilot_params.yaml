# Day 9 taxi-state design pilot (HANDOFF_D08 §4.1; X-D08-S03-0004 Q5 B2). Written 2026-10-07T22:20:39Z,
# committed before scripts/pilot_taxistate_D09.py ran and before the block was joined to any
# target. Not tuned on any data: windows (30/90 min), the clip (3,600 s) and the feature list
# were fixed in prc.taxistate before any target was read. Not an experiment: no E###, no fold
# score, no candidate selected.
design_months: [2025-01, 2025-04, 2025-05, 2025-06]   # X-D08-S01-0001 (d); Q5 B2
pilots:
  P1: {train: [2025-01, 2025-04, 2025-05], val: [2025-06]}
  P2: {train: [2025-01, 2025-04, 2025-06], val: [2025-05]}
reference: FS2                     # E045 / E020 configuration below, all rows, seed 42
candidate: FS2 + prc.taxistate.FEATURES (7 columns; P and T)
model:                             # E045 / E020's LightGBM (as the Day 8 weather pilot)
  objective: regression
  learning_rate: 0.05
  num_leaves: 255
  min_data_in_leaf: 100
  feature_fraction: 1.0
  bagging_fraction: 1.0
  bagging_freq: 0
  bin_construct_sample_cnt: 5000000
  num_threads: 4
  num_boost_round: 1000
seed: 42
readings:                          # all on the predicted month's DEP rows
  - all rows: RMSE of each, and the difference (candidate minus reference)
  - by airport
  - NM-missing against NM-present rows
  - tail (y >= 3,600 s) against bulk
  - the P-only variant (FS2 + P_FEATURES), reported only
decision_rule: >-
  H039 is written and sent for review only if the candidate's all-rows RMSE is at least 1.0 s
  below the reference's in both P1 and P2 (criterion 1's minimum). Otherwise the project
  follows HANDOFF_D08 §4.3 (refreeze; E050 stands). Segment readings and the P-only variant
  do not override this rule.
